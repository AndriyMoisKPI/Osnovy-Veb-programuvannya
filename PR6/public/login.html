<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Grid - Вхід</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-2">Вхід до Smart Grid Portal</h1>
            <p class="text-muted small mb-4">Портал керування інтелектуальною енергомережею міста.</p>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
              </div>
              <button class="btn btn-primary w-100" type="submit">Увійти</button>
            </form>
            <div id="result" class="alert mt-3 d-none"></div>
            <p class="mt-3 mb-0">Немає акаунту? <a href="/register.html">Зареєструватися</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>
<script src="/js/auth.js"></script>

</body>
</html>
