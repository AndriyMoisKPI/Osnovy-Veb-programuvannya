<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Grid - Реєстрація</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-2">Реєстрація в Smart Grid Portal</h1>
            <p class="text-muted small mb-4">Створення акаунту системного оператора, аналітика або адміністратора розумної енергомережі.</p>
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label" for="name">ПІБ</label>
                <input class="form-control" id="name" name="name" required minlength="2" autocomplete="name">
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" id="password" name="password" type="password" required minlength="10" autocomplete="new-password">
                <div class="form-text">Мінімум 10 символів, велика і мала літера, цифра.</div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="passwordConfirm">Повторіть пароль</label>
                <input class="form-control" id="passwordConfirm" name="passwordConfirm" type="password" required minlength="10" autocomplete="new-password">
              </div>
              <div class="mb-3">
                <label class="form-label" for="role">Роль</label>
                <select class="form-select" id="role" name="role" required>
                  <option value="operator">operator — контроль балансу мережі</option>
                  <option value="analyst">analyst — перегляд балансу та прогнози</option>
                  <option value="administrator">administrator — налаштування системи</option>
                </select>
              </div>
              <button class="btn btn-success w-100" type="submit">Зареєструватися</button>
            </form>
            <div id="result" class="alert mt-3 d-none"></div>
            <p class="mt-3 mb-0">Вже є акаунт? <a href="/login.html">Увійти</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>
<script src="/js/auth.js"></script>

</body>
</html>
