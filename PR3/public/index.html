<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДержЕнергоСервіс</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">ДержЕнерго<span>Сервіс</span></div>
            <nav>Система моніторингу енергосервісних контрактів</nav>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Реєстрація нового договору</h2>
            <form id="contractForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="number">Номер договору</label>
                        <input type="text" id="number" placeholder="Напр: 104/24-ЕСКО" required>
                    </div>
                    <div class="form-group">
                        <label for="customer">Замовник</label>
                        <input type="text" id="customer" placeholder="ТОВ 'Обленерго'" required>
                    </div>
                    <div class="form-group">
                        <label for="targetObject">Об'єкт</label>
                        <input type="text" id="targetObject" placeholder="Школа №12, котельня" required>
                    </div>
                    <div class="form-group">
                        <label for="cost">Вартість (грн)</label>
                        <input type="number" id="cost" min="1" step="0.01" placeholder="500000.00" required>
                    </div>
                    <div class="form-group">
                        <label for="savingsPercentage">Економія (%)</label>
                        <input type="number" id="savingsPercentage" min="1" max="100" step="0.1" placeholder="25.5" required>
                    </div>
                    <div class="form-group">
                        <label for="durationMonths">Термін (місяці)</label>
                        <input type="number" id="durationMonths" min="1" placeholder="60" required>
                    </div>
                </div>
                <button type="submit" id="submitBtn">Додати до реєстру</button>
            </form>
        </section>

        <section class="contracts-section">
            <h3>Активні договори</h3>
            <div id="contractsList"></div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 ДержЕнергоСервіс. Всі права захищені.</p>
            <p>Версія 2.0.4 (Stable)</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
